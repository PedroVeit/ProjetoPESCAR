<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pescar em Dados</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&display=swap">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body { background: #0d0f1a; transition: background .25s ease; font-family: "DM Sans", system-ui, sans-serif; }
      button { font-family: inherit; }
      button:active { transform: scale(0.97); }

      /* ---- Animações globais ---- */
      @keyframes fadeUp   { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @keyframes fadeIn   { from { opacity: 0; } to { opacity: 1; } }
      @keyframes growX    { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @keyframes spin     { to { transform: rotate(360deg); } }
      @keyframes pulse    { 0%,100% { opacity: .55; } 50% { opacity: 1; } }

      /* ---- Entrada de gráfico ---- */
      @keyframes drawIn { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
      @keyframes popIn  { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: none; } }
      @keyframes growY  { from { transform: scaleY(0); } to { transform: scaleY(1); } }

      .ch-draw { stroke-dasharray: 1; animation: drawIn .9s cubic-bezier(.33,1,.68,1) backwards; }
      .ch-pop  { transform-box: fill-box; transform-origin: center; animation: popIn .34s cubic-bezier(.22,1,.36,1) backwards; }
      .ch-bar  { transform-box: fill-box; transform-origin: bottom; animation: growY .55s cubic-bezier(.22,1,.36,1) backwards; }
      .ch-bar-x { transform-box: fill-box; transform-origin: left; animation: growX .5s cubic-bezier(.22,1,.36,1) backwards; }
      .ch-area { animation: fadeIn .5s ease .45s backwards; }

      .ui-card svg { overflow: visible; }
      .ui-card { transition: transform .18s ease, box-shadow .18s ease; }
      .ui-card:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,0,0,.22); }
      .ui-card:has(.ci-open) { z-index: 60; transform: none !important; }
      .nav-btn:not(.active):hover { background: rgba(127,127,127,.10) !important; }
      .nav-btn:focus-visible { outline: 2px solid currentColor; outline-offset: -2px; }
      tbody tr:hover td { background: rgba(127,127,127,.06); }

      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(127,127,127,.28); border-radius: 5px; border: 2px solid transparent; background-clip: content-box; }

      /* ---- Grades ---- */
      .g2 { display: grid; gap: 12px; grid-template-columns: 1fr; align-items: start; }
      @media (min-width: 1100px) { .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
      .g2-wide { display: grid; gap: 12px; grid-template-columns: 1fr; align-items: start; }
      @media (min-width: 1100px) { .g2-wide { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); } }
      .kpis { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      @media (min-width: 900px) { .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
      .mini-grid { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      @media (min-width: 900px) { .mini-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
      @media (min-width: 1400px) { .mini-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

      /* ---- Narrativa com rolagem (aba A História) ---- */
      .story { display: grid; grid-template-columns: 1fr; gap: 0; }
      .story-sticky { position: sticky; top: 0; height: 62vh; display: flex; align-items: center; justify-content: center; z-index: 1; }
      .story-steps { position: relative; z-index: 2; }
      .story-step { min-height: 78vh; display: flex; align-items: center; }
      @media (min-width: 1100px) {
        .story { grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); gap: 28px; }
        .story-sticky { order: 2; height: 100vh; }
        .story-steps { order: 1; }
        .story-step { min-height: 92vh; }
      }

      /* ---- Shell ---- */
      .shell { display: flex; min-height: calc(100vh - 54px); }
      .sidebar { width: 196px; flex-shrink: 0; }
      .main { flex: 1; min-width: 0; padding: 18px 22px 60px; }
      @media (max-width: 820px) {
        .shell { flex-direction: column; }
        .sidebar { width: 100%; }
        .sidebar-inner { position: static !important; max-height: none !important; display: flex; overflow-x: auto; gap: 4px; }
        .main { padding: 14px 16px 50px; }
      }

      html.estatico *, html.estatico *::before, html.estatico *::after { animation: none !important; transition: none !important; }
      @media (max-width: 820px) { .resp-card { grid-template-columns: 1fr !important; } }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; transition: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
